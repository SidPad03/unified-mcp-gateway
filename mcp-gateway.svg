     fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="MCP Gateway">
  <style>
    svg { stroke: #0B8F63; }
    @media (prefers-color-scheme: dark) { svg { stroke: #3FD69B; } }
  </style>
  <path d="M2 6.5H5L9 12"/>
  <path d="M2 12H9"/>
  <path d="M2 17.5H5L9 12"/>
  <path d="M9 12L13 8L17 12L13 16Z"/>
  <path d="M17 12H22"/>
</svg>
