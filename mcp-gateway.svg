<!--
  The MCP Gateway mark, for the project README. The source of truth is
  brand/mcp-gateway-mark.svg; this copy exists because a README <img> cannot
  inherit currentColor, so the colour is baked in and flipped with the viewer's
  appearance instead.
-->
