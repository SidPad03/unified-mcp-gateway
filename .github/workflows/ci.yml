name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Images are published to Docker Hub only. Publishing needs two repository
  # secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with
  # Read/Write/Delete — Delete is required by the `prune` job).
  DOCKERHUB_NAMESPACE: sidpad03
  # Tags kept per image, newest first, in addition to `latest`.
  KEEP_VERSIONS: 5

# Least privilege by default for GITHUB_TOKEN. Jobs needing more opt in; the
# two that talk only to Docker Hub drop it entirely with `permissions: {}`.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant. Never cancel
# on main: those runs publish images and cut releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────
  # Everything below depends on this, so a red test never publishes an image.
  # Runs on pull requests too, which is the point of requiring it for merge.
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpgateway
          POSTGRES_PASSWORD: mcpgateway
          POSTGRES_DB: mcpgateway
        options: >-
          --health-cmd "pg_isready -U mcpgateway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Enables the config-transfer round-trip tests, which need real Postgres
      # (`row_to_json` / `jsonb_populate_record` have no in-process equivalent).
      # Without this they skip, and the import bug they caught would ship.
      TEST_DATABASE_URL: postgresql://mcpgateway:mcpgateway@localhost:5432/mcpgateway
      # The API-key cipher derives its key from this. Test-only value.
      JWT_SECRET: ci-test-secret-not-used-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-gateway-server -> target
                      mcp-gateway-agent -> target

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mcp-gateway-server/Cargo.toml --check
          cargo fmt --manifest-path mcp-gateway-agent/Cargo.toml --check

      - name: Clippy (warnings are errors)
        run: |
          cargo clippy --manifest-path mcp-gateway-server/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path mcp-gateway-agent/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: |
          cargo test --manifest-path mcp-gateway-server/Cargo.toml
          cargo test --manifest-path mcp-gateway-agent/Cargo.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-gateway-dashboard/package-lock.json

      - name: Dashboard install
        working-directory: mcp-gateway-dashboard
        run: npm ci

      - name: Dashboard typecheck
        working-directory: mcp-gateway-dashboard
        run: npx tsc --noEmit

      - name: Dashboard build
        working-directory: mcp-gateway-dashboard
        run: npm run build

  # ── Version ───────────────────────────────────────────────────────────
  # Computed once and shared, so images, manifest tags, and the GitHub release
  # can never drift from each other.
  version:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(grep '^version' mcp-gateway-server/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1-2)

          EXISTING=$(gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep "^gateway-v${MAJOR_MINOR}\." \
            | sed "s/gateway-v${MAJOR_MINOR}\.//" \
            | sort -n | tail -1 || true)

          if [ -z "$EXISTING" ]; then
            PATCH=0
          else
            PATCH=$((EXISTING + 1))
          fi

          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Gateway version: ${VERSION}"

  # ── Build ─────────────────────────────────────────────────────────────
  # Each image is built for one architecture on its *native* runner (no QEMU)
  # and pushed by digest only. `merge` stitches the digests into one manifest.
  build:
    needs: [test, version]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: mcp-gateway-server
            context: ./mcp-gateway-server
          - name: mcp-gateway-dashboard
            context: ./mcp-gateway-dashboard
          - name: mcp-gateway-agent
            context: ./mcp-gateway-agent
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=docker.io/${DOCKERHUB_NAMESPACE}/${{ matrix.component.name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}-${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge ─────────────────────────────────────────────────────────────
  merge:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Talks only to Docker Hub, never to the GitHub API.
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        component: [mcp-gateway-server, mcp-gateway-dashboard, mcp-gateway-agent]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=docker.io/${DOCKERHUB_NAMESPACE}/${{ matrix.component }}" >> "$GITHUB_ENV"

      # Only `latest` and the version tag are published. A per-commit SHA tag
      # would be pruned on the next run anyway, and the version tag already maps
      # to a GitHub release, which maps to a commit.
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:v${{ needs.version.outputs.version }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE}:v${{ needs.version.outputs.version }}"

  # ── Prune ─────────────────────────────────────────────────────────────
  # Keeps storage bounded: `latest` plus the newest KEEP_VERSIONS version tags
  # per image. Everything else — older releases, and any historical SHA tags
  # from before this policy — is deleted from Docker Hub.
  prune:
    needs: [merge]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Talks only to the Docker Hub API; needs no GITHUB_TOKEN scope at all.
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        component: [mcp-gateway-server, mcp-gateway-dashboard, mcp-gateway-agent]
    steps:
      - name: Prune old tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          REPO="${DOCKERHUB_NAMESPACE}/${COMPONENT}"

          # The Hub API uses its own JWT, not the registry credential flow.
          TOKEN=$(curl -sS -f -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                  '{username:$u,password:$p}')" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not authenticate to the Docker Hub API"
            exit 1
          fi

          # Collect every tag, following pagination.
          tags=""
          url="https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100"
          while [ -n "$url" ] && [ "$url" != "null" ]; do
            page=$(curl -sS -f -H "Authorization: JWT ${TOKEN}" "$url")
            tags="${tags}"$'\n'"$(echo "$page" | jq -r '.results[].name')"
            url=$(echo "$page" | jq -r '.next')
          done
          tags=$(echo "$tags" | sed '/^$/d' | sort -u)

          # Newest KEEP_VERSIONS semver tags. `sort -V` so v1.1.10 beats v1.1.9,
          # which a lexical sort gets backwards.
          keep=$(echo "$tags" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V -r | head -n "${KEEP_VERSIONS}" | sed 's/^/v/' || true)

          echo "Keeping: latest $(echo $keep | tr '\n' ' ')"

          failed=0
          for tag in $tags; do
            [ "$tag" = "latest" ] && continue
            if echo "$keep" | grep -qx "$tag"; then continue; fi
            echo "Deleting ${REPO}:${tag}"
            if ! curl -sS -f -X DELETE -H "Authorization: JWT ${TOKEN}" \
                 "https://hub.docker.com/v2/repositories/${REPO}/tags/${tag}/"; then
              echo "::warning::Failed to delete ${REPO}:${tag}"
              failed=$((failed + 1))
            fi
          done

          # Individual deletes may race with a concurrent push; auth problems are
          # what matter and those already failed above.
          if [ "$failed" -gt 0 ]; then
            echo "::warning::${failed} tag(s) could not be deleted; they will be retried next run"
          fi

  # ── Release ───────────────────────────────────────────────────────────
  release-gateway:
    runs-on: ubuntu-latest
    needs: [version, merge]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="gateway-v${VERSION}"

          # Prefer the matching CHANGELOG section as the release notes; fall back
          # to a generic line if that version isn't documented yet.
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 { f = 1; print; next }
            /^## \[/ { if (f) exit }
            f
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "MCP Gateway Server + Dashboard v${VERSION} (multi-arch: linux/amd64, linux/arm64)" > notes.md
          fi

          gh release create "$TAG" \
            --title "Gateway v${VERSION}" \
            --notes-file notes.md \
            --target main
