name: CI

# Everything in this file runs on the self-hosted `homelab` runners. The one
# thing that cannot is the macOS agent app, which needs the macOS 26 SDK — that
# lives in agent-app.yml on a GitHub-hosted macos-26 image.
#
# The runners are x86_64, and the images are multi-arch. That is handled by
# cross-compiling inside the Dockerfiles rather than emulating a whole Rust
# build: see the header comment in mcp-gateway-server/Dockerfile.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Images are published to Docker Hub only. Publishing needs two repository
  # secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with
  # Read/Write/Delete — Delete is required by the `prune` job).
  DOCKERHUB_NAMESPACE: sidpad03
  # Tags kept per image, newest first, in addition to `latest`.
  KEEP_VERSIONS: 5

# Least privilege by default for GITHUB_TOKEN. Jobs needing more opt in; the
# one that talks only to Docker Hub drops it entirely with `permissions: {}`.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant. Never cancel
# on main: those runs publish images and cut releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────
  # Everything below depends on these, so a red test never publishes an image.
  # They run on pull requests too, which is the point of requiring them.
  #
  # Split by toolchain rather than kept as one job. The Rust and dashboard
  # halves share no inputs, no cache and no services, but as a single job they
  # ran back to back on one machine while the rest of the fleet sat idle through
  # the longest step in the pipeline. `test` below folds them back into the one
  # status check `main` requires.
  rust:
    name: rust
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpgateway
          POSTGRES_PASSWORD: mcpgateway
          POSTGRES_DB: mcpgateway
        options: >-
          --health-cmd "pg_isready -U mcpgateway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Container port only, so Docker assigns a free host port and the step
        # below reads it back. Pinning 5432:5432 would collide with a Postgres
        # already running on the runner host, and with the other runner if both
        # ran this job at once.
        ports:
          - 5432
    env:
      # The API-key cipher derives its key from this. Test-only value.
      JWT_SECRET: ci-test-secret-not-used-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The GitHub-hosted images ship rustup; a self-hosted runner may not, so
      # install it if it is missing. Idempotent, and a no-op after the first run.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # `actions/checkout` cleans ignored files, so `target/` does not survive
      # between runs even on a persistent runner. The cache still earns its keep.
      # rustup installs the Rust compiler and nothing else. Linking still needs a
      # system C toolchain, and the first crate with a build script dies with a
      # bare "linker `cc` not found" several minutes into the job, naming
      # neither the host nor the package. `runs-on: [self-hosted, homelab]`
      # matches any runner with those labels, so one unprovisioned machine in
      # the fleet fails every other run and looks like flakiness.
      - name: Preflight - a C toolchain must be present
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            echo "::error::Runner $(hostname) has no C linker, so nothing that needs one can build."
            echo "On that host:"
            echo "  sudo apt-get update && sudo apt-get install -y build-essential"
            echo "  sudo systemctl restart 'actions.runner.*'"
            exit 1
          fi
          cc --version | head -1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-gateway-server -> target
                      mcp-gateway-agent -> target

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mcp-gateway-server/Cargo.toml --check
          cargo fmt --manifest-path mcp-gateway-agent/Cargo.toml --all --check

      - name: Clippy (warnings are errors)
        run: |
          cargo clippy --manifest-path mcp-gateway-server/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path mcp-gateway-agent/Cargo.toml --workspace --all-targets -- -D warnings

      # The agent's crates carry no UI or platform dependency, so they build and
      # test here exactly as they do on a Mac. The SwiftUI app that links them is
      # built by agent-app.yml.
      - name: Rust tests
        env:
          # Enables the config-transfer round-trip tests, which need real
          # Postgres (`row_to_json` / `jsonb_populate_record` have no in-process
          # equivalent). Without this they skip, and the import bug they caught
          # would ship.
          TEST_DATABASE_URL: postgresql://mcpgateway:mcpgateway@localhost:${{ job.services.postgres.ports['5432'] }}/mcpgateway
        run: |
          cargo test --manifest-path mcp-gateway-server/Cargo.toml
          cargo test --manifest-path mcp-gateway-agent/Cargo.toml --workspace

  dashboard:
    name: dashboard
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-gateway-dashboard/package-lock.json

      - name: Install
        working-directory: mcp-gateway-dashboard
        run: npm ci

      - name: Typecheck
        working-directory: mcp-gateway-dashboard
        run: npx tsc --noEmit

      - name: Build
        working-directory: mcp-gateway-dashboard
        run: npm run build

  # `main` requires a status check named `test`, so the split keeps a job by
  # that name instead of needing every protection rule and open PR repointed at
  # two new ones. It is off the critical path: `version` and `build` gate on the
  # halves directly, so this only has to report.
  #
  # `always()` because a required check that is *skipped* when a dependency
  # fails leaves the pull request pending forever rather than going red.
  # The one required status check, so it has to speak for every part of the
  # product. The agent joined this list when it stopped being a workflow of its
  # own: it used to report its own check on a pull request, and dropping it in
  # here without saying so would have quietly stopped the macOS build from
  # blocking a merge. `always()` plus an explicit comparison, rather than the
  # default "succeeded or skipped", so a job that never ran counts as a failure.
  test:
    name: test
    needs: [rust, dashboard, agent]
    if: always()
    runs-on: [self-hosted, homelab]
    permissions: {}
    steps:
      - name: Report
        run: |
          echo "rust:      ${{ needs.rust.result }}"
          echo "dashboard: ${{ needs.dashboard.result }}"
          echo "agent:     ${{ needs.agent.result }}"
          [ "${{ needs.rust.result }}" = success ] || exit 1
          [ "${{ needs.dashboard.result }}" = success ] || exit 1
          [ "${{ needs.agent.result }}" = success ] || exit 1

  # ── Version ───────────────────────────────────────────────────────────
  # Computed once and shared, so images, manifest tags, and the GitHub release
  # can never drift from each other.
  version:
    needs: [rust, dashboard]
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the base version
        id: base
        run: |
          BASE=$(grep '^version' mcp-gateway-server/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "major_minor=$(echo "$BASE" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      # github-script rather than the gh CLI: a self-hosted runner is not
      # guaranteed to have gh installed, and this needs no binary beyond the
      # runner's own node.
      - name: Compute version
        id: version
        uses: actions/github-script@v7
        env:
          MAJOR_MINOR: ${{ steps.base.outputs.major_minor }}
        with:
          script: |
            const majorMinor = process.env.MAJOR_MINOR;
            // One counter across both release lines, not one per line.
            //
            // Counting only `gateway-v*` here, and only `agent-v*` in the agent
            // workflow, is what let the two drift: when one pipeline failed the
            // other carried on, and the same number stopped describing the same
            // build of the same product. Taking the highest patch across both
            // prefixes holds both lines together, so a failure parks them at the
            // same number and the next green run moves them as a pair.
            const prefixes = [`gateway-v${majorMinor}.`, `agent-v${majorMinor}.`];
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const patches = releases
              .map(r => r.tag_name)
              .flatMap(tag => {
                const prefix = prefixes.find(p => tag.startsWith(p));
                return prefix ? [Number.parseInt(tag.slice(prefix.length), 10)] : [];
              })
              .filter(Number.isInteger);
            const patch = patches.length ? Math.max(...patches) + 1 : 0;
            const version = `${majorMinor}.${patch}`;
            core.setOutput('version', version);
            core.info(`Gateway version: ${version}`);

  # ── Agent app ─────────────────────────────────────────────────────────
  # The macOS app. It needs the macOS 26 SDK, so it is the one thing here that
  # builds on GitHub's runners rather than the homelab fleet.
  #
  # It is a node in this graph rather than a workflow of its own, which is what
  # lets the images below wait for it. While it triggered itself it kept
  # publishing straight through failures here: a run where the Rust job could
  # not find a C linker still shipped an app, which is how gateway-v1.0.3 came
  # to sit beside agent-v1.0.5. It now builds and signs only, and both
  # components are released together at the end of the run.
  agent:
    needs: [rust, dashboard, version]
    uses: ./.github/workflows/agent-app.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # ── Build ─────────────────────────────────────────────────────────────
  # One build per component, producing both architectures and pushing a single
  # multi-arch manifest. There is no separate merge step any more: the images
  # used to be built per-arch on native runners and stitched together
  # afterwards, which was how they avoided QEMU. Cross-compiling in the
  # Dockerfile does that job instead, from one machine.
  #
  # Pull requests build but do not push, so a broken cross-build is caught
  # before it reaches main.
  #
  # Waits on `agent` as well as the tests: an image pushed while the app build
  # was still running, or had already failed, is a published version of half the
  # product. Nothing leaves this run until everything in it has been built.
  build:
    needs: [rust, dashboard, version, agent]
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: mcp-gateway-server
            context: ./mcp-gateway-server
          - name: mcp-gateway-dashboard
            context: ./mcp-gateway-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=docker.io/${DOCKERHUB_NAMESPACE}/${{ matrix.component.name }}" >> "$GITHUB_ENV"

      # `runs-on: [self-hosted, homelab]` matches any runner carrying those
      # labels, so a machine whose runner user is not in the `docker` group can
      # take the job and then fail several steps later, inside setup-qemu, with
      # a bare "permission denied ... /var/run/docker.sock" and no hint as to
      # which host or what to do. Fail here instead, naming both.
      - name: Preflight - the Docker daemon must be reachable
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Runner $(hostname) cannot reach the Docker daemon. Add its runner user to the docker group and restart the runner service."
            echo "On that host:"
            echo "  sudo usermod -aG docker $(id -un)"
            echo "  sudo systemctl restart 'actions.runner.*'"
            exit 1
          fi

      # Still needed, but for much less than before. The Rust build is
      # cross-compiled; what is emulated is the server runtime stage's apt-get
      # and two tarballs. The dashboard emulates nothing at all — its runtime
      # stage is COPY only.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publishing is main-only, and says so rather than relying on the `on:`
      # block above listing main and nothing else. `event_name == 'push'` alone
      # is true for a push to any branch the trigger is later widened to, and
      # the steps it gates here overwrite `:latest` and delete Docker Hub tags.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only `latest` and the version tag are published. A per-commit SHA tag
      # would be pruned on the next run anyway, and the version tag already maps
      # to a GitHub release, which maps to a commit.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          # Read the cache everywhere, write it only from main.
          #
          # `mode=max` exports every intermediate layer, and on a self-hosted
          # runner that upload crosses the building's own connection instead of
          # hopping inside Azure. Measured here: the server build spent 215s of
          # its 507s exporting cache, 42% of the job, to produce an entry the
          # next push to main overwrites anyway. Pull requests still read the
          # cache, so they keep the speed-up without paying to refill it.
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.component.name) || '' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ needs.version.outputs.version }}

      - name: Inspect manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools inspect "${IMAGE}:v${{ needs.version.outputs.version }}"

      # A self-hosted runner keeps whatever a job leaves behind, and a
      # multi-arch buildx run leaves a lot: cache blobs, dangling layers, the
      # emulator image. Left alone the fleet fills its disk and starts
      # thrashing, which reads as a memory problem long before it reads as a
      # disk one.
      #
      # Deliberately narrow, because these boxes also run the homelab's own
      # services: `image prune` without `-a` removes only dangling layers, and
      # nothing here can touch a tagged image, a volume, or a running container.
      # `always()` because a failed build is when the most is left behind.
      - name: Free the runner
        if: always()
        run: |
          docker buildx prune --force --filter until=72h || true
          docker image prune --force || true
          echo "-- disk --";   df -h / | tail -1 || true
          echo "-- memory --"; free -h | head -2 || true

  # ── Prune ─────────────────────────────────────────────────────────────
  # Keeps storage bounded: `latest` plus the newest KEEP_VERSIONS version tags
  # per image. Everything else — older releases, and any historical SHA tags
  # from before this policy — is deleted from Docker Hub.
  prune:
    needs: [build]
    # Deletes tags from Docker Hub, so it is pinned to main explicitly.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]
    # Talks only to the Docker Hub API; needs no GITHUB_TOKEN scope at all.
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        component: [mcp-gateway-server, mcp-gateway-dashboard]
    steps:
      - name: Prune old tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          REPO="${DOCKERHUB_NAMESPACE}/${COMPONENT}"

          # The Hub API uses its own JWT, not the registry credential flow.
          TOKEN=$(curl -sS -f -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                  '{username:$u,password:$p}')" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not authenticate to the Docker Hub API"
            exit 1
          fi

          # Collect every tag, following pagination.
          tags=""
          url="https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100"
          while [ -n "$url" ] && [ "$url" != "null" ]; do
            page=$(curl -sS -f -H "Authorization: JWT ${TOKEN}" "$url")
            tags="${tags}"$'\n'"$(echo "$page" | jq -r '.results[].name')"
            url=$(echo "$page" | jq -r '.next')
          done
          tags=$(echo "$tags" | sed '/^$/d' | sort -u)

          # Newest KEEP_VERSIONS semver tags. `sort -V` so v1.1.10 beats v1.1.9,
          # which a lexical sort gets backwards.
          keep=$(echo "$tags" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V -r | head -n "${KEEP_VERSIONS}" | sed 's/^/v/' || true)

          echo "Keeping: latest $(echo $keep | tr '\n' ' ')"

          failed=0
          for tag in $tags; do
            [ "$tag" = "latest" ] && continue
            if echo "$keep" | grep -qx "$tag"; then continue; fi
            echo "Deleting ${REPO}:${tag}"
            if ! curl -sS -f -X DELETE -H "Authorization: JWT ${TOKEN}" \
                 "https://hub.docker.com/v2/repositories/${REPO}/tags/${tag}/"; then
              echo "::warning::Failed to delete ${REPO}:${tag}"
              failed=$((failed + 1))
            fi
          done

          # Individual deletes may race with a concurrent push; auth problems are
          # what matter and those already failed above.
          if [ "$failed" -gt 0 ]; then
            echo "::warning::${failed} tag(s) could not be deleted; they will be retried next run"
          fi

  # ── Release ───────────────────────────────────────────────────────────
  release-gateway:
    runs-on: [self-hosted, homelab]
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prefer the matching CHANGELOG section as the release notes; fall back to
      # a generic line if that version isn't documented yet.
      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 { f = 1; print; next }
            /^## \[/ { if (f) exit }
            f
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "MCP Gateway Server + Dashboard v${VERSION} (multi-arch: linux/amd64, linux/arm64)" > notes.md
          fi

      - name: Create release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `gateway-v${version}`,
              name: `Gateway v${version}`,
              body: fs.readFileSync('notes.md', 'utf8'),
              target_commitish: 'main',
            });

  # The agent's half of the release, cut from the artifact the `agent` job
  # built. Deliberately a sibling of release-gateway on the same `needs`, so
  # the two release lines can only ever move together: either the whole run is
  # green and both publish at the same version, or neither does and both stay
  # parked at the last number they shared.
  release-agent:
    runs-on: [self-hosted, homelab]
    needs: [version, agent, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: ${{ needs.agent.outputs.archive }}
    steps:
      - name: Download the app
        uses: actions/download-artifact@v4
        with:
          name: agent-app
          path: dist

      - name: Create the release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = process.env.VERSION;
            const { owner, repo } = context.repo;

            const body = [
              `MCP Gateway Agent v${version} — universal (Apple Silicon and Intel), macOS 26 or later.`,
              ``,
              `## Installing`,
              ``,
              `The app is ad-hoc signed rather than notarized, so the first launch needs one extra step:`,
              `**right-click the app and choose Open**, then confirm. macOS remembers the choice.`,
              '(Or run `xattr -dr com.apple.quarantine "/Applications/MCP Gateway Agent.app"`.)',
              ``,
              `Updates after that install themselves — the quarantine flag is not applied to them.`,
              ``,
              `## Setting it up`,
              ``,
              `Open the app, enter your gateway address, and sign in through the browser.`,
              `There is no API key to create or paste.`,
            ].join('\n');

            const release = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: `agent-v${version}`,
              name: `Agent v${version}`,
              body,
              target_commitish: 'main',
            });

            for (const name of [`MCP-Gateway-Agent-${version}.dmg`, process.env.ARCHIVE]) {
              const file = path.join('dist', name);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo,
                release_id: release.data.id,
                name,
                data: fs.readFileSync(file),
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fs.statSync(file).size,
                },
              });
            }

      # Deliberately NOT releases/latest/download/…: this repository interleaves
      # gateway-v* and agent-v* tags, so "latest release" is regularly a gateway
      # release with no app in it, and the updater would 404. `agent-latest` is a
      # permanent, non-"latest" release whose only asset is this manifest.
      - name: Publish the update manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const archive = process.env.ARCHIVE;
            const { owner, repo } = context.repo;

            const manifest = {
              version,
              url: `https://github.com/${owner}/${repo}/releases/download/agent-v${version}/${archive}`,
              signature: fs.readFileSync('dist/signature.txt', 'utf8').trim(),
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
              notes: `MCP Gateway Agent v${version}`,
            };
            if (!manifest.signature) {
              core.warning('this release is unsigned, so the app will decline to install it');
            }

            let pointer;
            try {
              pointer = (await github.rest.repos.getReleaseByTag({
                owner, repo, tag: 'agent-latest',
              })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              pointer = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: 'agent-latest',
                name: 'Agent update manifest',
                body: 'Machine-readable pointer to the newest agent release. Not a release itself.',
                target_commitish: 'main',
              })).data;
            }

            // An asset name is unique within a release, so the old one has to go
            // before the new one can take its place.
            for (const asset of pointer.assets.filter(a => a.name === 'appcast.json')) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

            const data = JSON.stringify(manifest, null, 2);
            await github.rest.repos.uploadReleaseAsset({
              owner, repo,
              release_id: pointer.id,
              name: 'appcast.json',
              data,
              headers: {
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(data),
              },
            });
            core.info(`appcast now points at ${version}`);

      # ── Homebrew tap ───────────────────────────────────────────────────
      # Point the cask at the release that just published.
      #
      # Without this the tap goes stale the instant a version ships, and since
      # the cask is what brew installs, `brew install` keeps handing out the
      # previous build until somebody remembers to bump it by hand. That has
      # already happened for three releases running.
      #
      # It needs a credential that can write to the *tap* repository, because the
      # automatic GITHUB_TOKEN is scoped to this one. That credential is an SSH
      # deploy key on SidPad03/homebrew-tap, with its private half stored here as
      # HOMEBREW_TAP_SSH_KEY. A deploy key rather than a personal access token
      # deliberately: it reaches exactly one repository, so the blast radius if
      # this secret ever leaks is the tap and nothing else.
      #
      # Skipped when the secret is absent, so a fork still builds and releases.
      - name: Update the Homebrew cask
        if: env.TAP_KEY != ''
        run: |
          set -euo pipefail
          DMG="dist/MCP-Gateway-Agent-${VERSION}.dmg"
          SHA=$(sha256sum "$DMG" | awk '{print $1}')

          # ssh will not read a key from stdin, so it goes to a file with tight
          # permissions and is removed however this step exits.
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$TAP_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          export GIT_SSH_COMMAND="ssh -i $KEYFILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          rm -rf tap
          git clone --depth 1 git@github.com:SidPad03/homebrew-tap.git tap
          cd tap
          CASK="Casks/mcp-gateway-agent.rb"

          # Anchored to the start of the line so a version-shaped string
          # anywhere else in the file, a comment or the livecheck regex, cannot
          # be rewritten by accident.
          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK"

          # A sed that matches nothing exits 0, so confirm rather than assume.
          grep -q "^  version \"${VERSION}\"$" "$CASK" || {
            echo "::error::the cask version was not rewritten"; exit 1; }
          grep -q "^  sha256 \"${SHA}\"$" "$CASK" || {
            echo "::error::the cask sha256 was not rewritten"; exit 1; }

          if git diff --quiet; then
            echo "cask already points at ${VERSION}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "mcp-gateway-agent ${VERSION}"
          git push -q
          echo "cask bumped to ${VERSION}"
