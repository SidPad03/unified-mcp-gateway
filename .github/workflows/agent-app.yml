name: Agent app

# The one workflow that does not run on the self-hosted `homelab` runners.
#
# It needs the macOS 26 SDK to compile SwiftUI, and to run `codesign`,
# `iconutil` and `hdiutil` — none of which exist on Linux. Everything else in
# this repository, including the agent's own Rust crates and their 72 tests,
# runs on the self-hosted fleet via ci.yml; what is left here is the Swift
# compile, the bundle, and the release artifacts.
#
# The repository is public, so GitHub-hosted runners are unmetered.
# Called by ci.yml rather than triggered on its own.
#
# It used to run independently on any change under `mcp-gateway-agent/**`, which
# is what let the two release lines come apart: when CI failed, this carried on
# publishing, and gateway-v1.0.3 sat next to agent-v1.0.5. Nothing could gate one
# on the other because they were separate workflow runs with no edge between
# them. As a called workflow it is a node in ci.yml's graph, so the images can
# depend on it and the version is handed in rather than counted here.
#
# It builds and signs; it does not publish. Cutting the release here would only
# move the race rather than remove it — the app would ship the moment it built,
# and an image build that failed afterwards would still leave the two lines
# apart. ci.yml collects the artifacts below and releases both components
# together, once everything has been built.
on:
  workflow_call:
    inputs:
      version:
        description: The version to build, decided once by the caller.
        required: true
        type: string
      release:
        description: >-
          Whether this build is headed for a release, which is what decides
          if it is worth notarizing. Publishing itself happens in ci.yml.
        required: false
        default: false
        type: boolean
    outputs:
      version:
        description: The version that was built.
        value: ${{ jobs.build.outputs.version }}
      archive:
        description: Filename of the update archive inside the artifact.
        value: ${{ jobs.build.outputs.archive }}
      notarized:
        description: >-
          'true' when the build was Developer ID signed and notarized, so the
          release notes can say whether the first launch needs a workaround.
        value: ${{ jobs.build.outputs.notarized }}
  workflow_dispatch:
    inputs:
      version:
        description: Version to build by hand. Nothing is published.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    # Liquid Glass needs the macOS 26 SDK, which means Xcode 26, which means a
    # macos-26 image. macos-14 cannot build this app.
    runs-on: macos-26
    # Read-only: this job hands its output to ci.yml, which does the writing.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.archive.outputs.archive }}
      notarized: ${{ steps.build.outputs.notarized }}
    # Hoisted to the job so the `if:` conditions below can see them. A step-level
    # `env:` is not in scope for that step's own `if:`, which is a quiet way to
    # write a gate that never fires.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      SIGNING_KEY: ${{ secrets.MCPGA_UPDATE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-gateway-agent -> target

      # ── Version ────────────────────────────────────────────────────────
      # Handed in, not counted. Two workflows each counting releases for
      # themselves is what let the lines drift: both read the tag list at
      # slightly different moments, and a failure in one left the other's
      # number describing a build that shipped alone. ci.yml now counts once,
      # across both lines, and every artifact in the run carries that number.
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Agent version: ${VERSION}"

      # ── Apple signing ──────────────────────────────────────────────────
      # Gated on the secrets, so a fork or a pull request without them still
      # builds, ad-hoc signed. With APPLE_CERTIFICATE present, build.sh finds
      # the imported Developer ID identity on its own; APPLE_SIGNING_IDENTITY
      # is only needed to pick one when the .p12 holds several.
      - name: Import the Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # The G2 intermediate that issued the certificate. A runner image is
          # not guaranteed to carry it, and without it codesign cannot build the
          # chain to Apple's root.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      # ── Build ──────────────────────────────────────────────────────────
      # Notarization happens inside build.sh, not in a step of its own, so a
      # release build here and `build.sh --notarize` on a Mac are the same
      # thing. It runs only for a release: every submission waits on Apple,
      # and a pull request build is never downloaded by anyone but its author.
      - name: Build the app
        id: build
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE: ${{ inputs.release }}
          # Embedding the public key is what lets a build install its own
          # updates. Without the secret the app reports updates and declines to
          # install them, which is the right way round.
          MCPGA_UPDATE_PUBLIC_KEY: ${{ secrets.MCPGA_UPDATE_PUBLIC_KEY }}
        run: |
          NOTARIZE_FLAG=""
          if [ "$RELEASE" = "true" ] && [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            NOTARIZE_FLAG="--notarize"
          fi
          # shellcheck disable=SC2086
          mcp-gateway-agent/macos/build.sh \
            --version "${{ steps.version.outputs.version }}" \
            --universal --dmg $NOTARIZE_FLAG
          if [ -n "$NOTARIZE_FLAG" ]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      # `lipo` lists slices in the order they were combined, not a fixed one.
      # The old check grepped `-info` output for the literal string
      # "arm64 x86_64", so a genuinely universal bundle that lipo described as
      # "x86_64 arm64" failed the build. Ask for each architecture separately.
      - name: Verify the bundle is universal
        run: |
          BINARY="mcp-gateway-agent/build/MCP Gateway Agent.app/Contents/MacOS/MCPGatewayAgent"
          ARCHS=$(lipo -archs "$BINARY")
          echo "Architectures: $ARCHS"
          for want in arm64 x86_64; do
            grep -qw "$want" <<<"$ARCHS" \
              || { echo "::error::the binary has no $want slice (found: $ARCHS)"; exit 1; }
          done

      # ── Update archive ─────────────────────────────────────────────────
      # The updater replaces the bundle in place from a .app.tar.gz; the .dmg is
      # only for a first install. On a notarized build the bundle tarred here
      # already carries its stapled ticket.
      - name: Install the signing dependency
        if: env.SIGNING_KEY != ''
        run: python3 -m pip install --quiet --break-system-packages cryptography

      - name: Package the update archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd mcp-gateway-agent/build
          ARCHIVE="MCP-Gateway-Agent-${VERSION}.app.tar.gz"
          tar -czf "$ARCHIVE" "MCP Gateway Agent.app"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

          if [ -n "$SIGNING_KEY" ]; then
            # Ed25519 over the archive bytes, verified in the app with CryptoKit.
            # A hash published beside the file only proves it downloaded intact;
            # a signature proves who built it.
            python3 - "$ARCHIVE" <<'PY' > signature.txt
          import base64, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["SIGNING_KEY"]))
          print(base64.b64encode(key.sign(open(sys.argv[1], "rb").read())).decode())
          PY
            echo "signature=$(cat signature.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MCPGA_UPDATE_PRIVATE_KEY is not set — this release cannot be auto-installed"
            : > signature.txt
            echo "signature=" >> "$GITHUB_OUTPUT"
          fi

      # ── Hand off ───────────────────────────────────────────────────────
      # Everything the release needs travels as one artifact: the installer, the
      # update archive, and the detached signature over it. ci.yml picks this up
      # after the images are built and publishes the two components together.
      #
      # Uploaded on every run, not just releases. On a pull request it is the
      # only way to get the built app off the runner and try it.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: agent-app
          path: |
            mcp-gateway-agent/build/*.dmg
            mcp-gateway-agent/build/*.app.tar.gz
            mcp-gateway-agent/build/signature.txt
          if-no-files-found: error
          retention-days: 7
