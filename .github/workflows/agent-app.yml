name: Agent app

# The one workflow that does not run on the self-hosted `homelab` runners.
#
# It needs the macOS 26 SDK to compile SwiftUI, and to run `codesign`,
# `iconutil` and `hdiutil` — none of which exist on Linux. Everything else in
# this repository, including the agent's own Rust crates and their 72 tests,
# runs on the self-hosted fleet via ci.yml; what is left here is the Swift
# compile, the bundle, and the release artifacts.
#
# The repository is public, so GitHub-hosted runners are unmetered.
on:
  push:
    branches: [main]
    paths:
      - 'mcp-gateway-agent/**'
      - '.github/workflows/agent-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-gateway-agent/**'
      - '.github/workflows/agent-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    # Liquid Glass needs the macOS 26 SDK, which means Xcode 26, which means a
    # macos-26 image. macos-14 cannot build this app.
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Hoisted to the job so the `if:` conditions below can see them. A step-level
    # `env:` is not in scope for that step's own `if:`, which is a quiet way to
    # write a gate that never fires.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      SIGNING_KEY: ${{ secrets.MCPGA_UPDATE_PRIVATE_KEY }}
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-gateway-agent -> target

      # ── Version ────────────────────────────────────────────────────────
      # Counted from the existing agent-v* releases, the same scheme the
      # gateway uses. With every old release deleted, the first build of the app
      # is agent-v1.0.0.
      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(grep '^version' mcp-gateway-agent/ffi/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1-2)

          # One counter across both release lines, matching ci.yml. Counting only
          # `agent-v*` here, and only `gateway-v*` there, is what let the two
          # drift: a failed pipeline stopped one line while the other carried on,
          # so the same number stopped describing the same build of the same
          # product.
          EXISTING=$(gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep -E "^(agent|gateway)-v${MAJOR_MINOR}\." \
            | sed -E "s/^(agent|gateway)-v${MAJOR_MINOR}\.//" \
            | sort -n | tail -1 || true)

          if [ -z "$EXISTING" ]; then PATCH=0; else PATCH=$((EXISTING + 1)); fi

          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Agent version: ${VERSION}"

      # ── Apple signing (optional) ───────────────────────────────────────
      # Decision D1: the app ships ad-hoc signed. These steps are present but
      # gated, so adding the secrets later switches on real signing and
      # notarization with no rewrite of this file.
      - name: Import the Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Embedding the public key is what lets a build install its own
          # updates. Without the secret the app reports updates and declines to
          # install them, which is the right way round.
          MCPGA_UPDATE_PUBLIC_KEY: ${{ secrets.MCPGA_UPDATE_PUBLIC_KEY }}
        run: |
          mcp-gateway-agent/macos/build.sh \
            --version "${{ steps.version.outputs.version }}" \
            --universal --dmg

      # `lipo` lists slices in the order they were combined, not a fixed one.
      # The old check grepped `-info` output for the literal string
      # "arm64 x86_64", so a genuinely universal bundle that lipo described as
      # "x86_64 arm64" failed the build. Ask for each architecture separately.
      - name: Verify the bundle is universal
        run: |
          BINARY="mcp-gateway-agent/build/MCP Gateway Agent.app/Contents/MacOS/MCPGatewayAgent"
          ARCHS=$(lipo -archs "$BINARY")
          echo "Architectures: $ARCHS"
          for want in arm64 x86_64; do
            grep -qw "$want" <<<"$ARCHS" \
              || { echo "::error::the binary has no $want slice (found: $ARCHS)"; exit 1; }
          done

      - name: Notarize
        if: env.APPLE_ID != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG="mcp-gateway-agent/build/MCP-Gateway-Agent-${VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"

      # ── Update archive ─────────────────────────────────────────────────
      # The updater replaces the bundle in place from a .app.tar.gz; the .dmg is
      # only for a first install.
      - name: Install the signing dependency
        if: env.SIGNING_KEY != ''
        run: python3 -m pip install --quiet --break-system-packages cryptography

      - name: Package the update archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd mcp-gateway-agent/build
          ARCHIVE="MCP-Gateway-Agent-${VERSION}.app.tar.gz"
          tar -czf "$ARCHIVE" "MCP Gateway Agent.app"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

          if [ -n "$SIGNING_KEY" ]; then
            # Ed25519 over the archive bytes, verified in the app with CryptoKit.
            # A hash published beside the file only proves it downloaded intact;
            # a signature proves who built it.
            python3 - "$ARCHIVE" <<'PY' > signature.txt
          import base64, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["SIGNING_KEY"]))
          print(base64.b64encode(key.sign(open(sys.argv[1], "rb").read())).decode())
          PY
            echo "signature=$(cat signature.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MCPGA_UPDATE_PRIVATE_KEY is not set — this release cannot be auto-installed"
            echo "signature=" >> "$GITHUB_OUTPUT"
          fi

      # ── Release ────────────────────────────────────────────────────────
      - name: Create the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd mcp-gateway-agent/build
          TAG="agent-v${VERSION}"

          cat > notes.md <<EOF
          MCP Gateway Agent v${VERSION} — universal (Apple Silicon and Intel), macOS 26 or later.

          ## Installing

          The app is ad-hoc signed rather than notarized, so the first launch needs one extra step:
          **right-click the app and choose Open**, then confirm. macOS remembers the choice.
          (Or run \`xattr -dr com.apple.quarantine "/Applications/MCP Gateway Agent.app"\`.)

          Updates after that install themselves — the quarantine flag is not applied to them.

          ## Setting it up

          Open the app, enter your gateway address, and sign in through the browser.
          There is no API key to create or paste.
          EOF

          gh release create "$TAG" \
            --title "Agent v${VERSION}" \
            --notes-file notes.md \
            --target main \
            "MCP-Gateway-Agent-${VERSION}.dmg" \
            "${{ steps.archive.outputs.archive }}"

      # ── Update manifest ────────────────────────────────────────────────
      # Deliberately NOT releases/latest/download/…: this repository interleaves
      # gateway-v* and agent-v* tags, so "latest release" is regularly a gateway
      # release with no app in it, and the updater would 404. `agent-latest` is a
      # permanent, non-"latest" release whose only asset is this manifest.
      - name: Publish the update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cd mcp-gateway-agent/build
          ARCHIVE="${{ steps.archive.outputs.archive }}"

          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/${REPO}/releases/download/agent-v${VERSION}/${ARCHIVE}" \
            --arg signature "${{ steps.archive.outputs.signature }}" \
            --arg pubDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "MCP Gateway Agent v${VERSION}" \
            '{version: $version, url: $url, signature: $signature, pub_date: $pubDate, notes: $notes}' \
            > appcast.json

          gh release view agent-latest >/dev/null 2>&1 || \
            gh release create agent-latest \
              --title "Agent update manifest" \
              --notes "Machine-readable pointer to the newest agent release. Not a release itself." \
              --target main

          gh release upload agent-latest appcast.json --clobber

      # ── Homebrew tap ───────────────────────────────────────────────────
      # Point the cask at the release that just published.
      #
      # Without this the tap goes stale the instant a version ships, and since
      # the cask is what brew installs, `brew install` keeps handing out the
      # previous build until somebody remembers to bump it by hand. That has
      # already happened for three releases running.
      #
      # It needs a credential that can write to the *tap* repository, because the
      # automatic GITHUB_TOKEN is scoped to this one. That credential is an SSH
      # deploy key on SidPad03/homebrew-tap, with its private half stored here as
      # HOMEBREW_TAP_SSH_KEY. A deploy key rather than a personal access token
      # deliberately: it reaches exactly one repository, so the blast radius if
      # this secret ever leaks is the tap and nothing else.
      #
      # Skipped when the secret is absent, so a fork still builds and releases.
      - name: Update the Homebrew cask
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.TAP_KEY != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="mcp-gateway-agent/build/MCP-Gateway-Agent-${VERSION}.dmg"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')

          # ssh will not read a key from stdin, so it goes to a file with tight
          # permissions and is removed however this step exits.
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$TAP_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          export GIT_SSH_COMMAND="ssh -i $KEYFILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:SidPad03/homebrew-tap.git tap
          cd tap
          CASK="Casks/mcp-gateway-agent.rb"

          # Anchored to the start of the line so a version-shaped string
          # anywhere else in the file, a comment or the livecheck regex, cannot
          # be rewritten by accident.
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK"

          # A sed that matches nothing exits 0, so confirm rather than assume.
          grep -q "^  version \"${VERSION}\"$" "$CASK" || {
            echo "::error::the cask version was not rewritten"; exit 1; }
          grep -q "^  sha256 \"${SHA}\"$" "$CASK" || {
            echo "::error::the cask sha256 was not rewritten"; exit 1; }

          if git diff --quiet; then
            echo "cask already points at ${VERSION}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "mcp-gateway-agent ${VERSION}"
          git push -q
          echo "cask bumped to ${VERSION}"

      - name: Upload the build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MCP-Gateway-Agent-${{ steps.version.outputs.version }}
          path: mcp-gateway-agent/build/*.dmg
          retention-days: 7
