[package]
name = "mcp-gateway-server"
version = "1.1.0"
edition = "2021"
description = "MCP Gateway - MCP aggregation, routing, and security layer"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Auth
# Use the pure-Rust crypto backend. jsonwebtoken 10 defaults to `aws_lc_rs`,
# which needs a process-wide rustls CryptoProvider to be installed or it fails
# at runtime (CryptoProvider error) the first time a token is encoded/decoded —
# breaking login. `rust_crypto` (RustCrypto hmac/sha2) has no such requirement.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"

# IDs and time
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# Authenticated encryption for API keys stored at rest (so the dashboard can
# reveal a client's key for the "copy config" flow without keeping plaintext).
chacha20poly1305 = "0.10"
# Config export/import bundles: gzip before sealing, base64 for the envelope.
flate2 = "1"
base64 = "0.22"

# Config
dotenvy = "0.15"
anyhow = "1"
regex = "1"
semver = "1"

# HTTP client (for remote backends)
# rustls rather than native-tls, matching sqlx and jsonwebtoken — this was the
# only thing pulling OpenSSL (and a C toolchain) into an otherwise pure-Rust
# build, which is what made the arm64 image impossible to cross-compile.
#
# `native-roots` and not `webpki-roots`: the runtime image runs
# `update-ca-certificates` on start, so deployments that put a private CA in
# /usr/local/share/ca-certificates keep working. rustls reads the same system
# store OpenSSL did.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
