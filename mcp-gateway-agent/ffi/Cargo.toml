[package]
name = "mcp-gateway-agent-ffi"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI over mcp-gateway-agent-core, linked into the SwiftUI app."

[lib]
# A static library so the whole agent ends up inside the one binary in the .app
# — no dylib to sign separately, no @rpath to get wrong.
crate-type = ["staticlib"]

[dependencies]
mcp-gateway-agent-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
