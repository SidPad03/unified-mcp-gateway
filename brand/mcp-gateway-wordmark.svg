<!--
  MCP Gateway — horizontal lockup (mark + wordmark) for READMEs and headers.

  The text is live, set in the system UI stack so it renders sensibly wherever
  the SVG is embedded. If this is ever used in print or on a surface where exact
  letterforms matter, outline the text first — live text will fall back to a
  different face on machines without the preferred font.

  Clear space: keep at least the mark's own height (24 units) free on all sides.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="248" height="40" viewBox="0 0 248 40"
     role="img" aria-label="MCP Gateway">
  <g transform="translate(0 8)"
     fill="none" stroke="#7C5CFC" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 6.5h3L10 12"/>
    <path d="M2.5 12h7.5"/>
    <path d="M2.5 17.5h3L10 12"/>
    <path d="M14 8 18 12l-4 4-4-4Z"/>
    <path d="M18 12h3.5"/>
  </g>
  <text x="36" y="26"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" letter-spacing="-0.4"
        fill="#E8E8F0">MCP Gateway</text>
</svg>
