<!--
  MCP Gateway Agent — macOS app icon source.

  1024x1024 on Apple's macOS grid: an 824x824 squircle inset by 100 with a 185
  corner radius, so the artwork sits correctly next to system icons in the Dock.

  The tile is a dark, cold steel plate rather than a coloured one. A Dock is a row
  of saturated squares; an unlit instrument face with one thing glowing on it is
  both more distinctive there and honest about what the app is. The glyph is a
  heavier cut of the shared mark (stroke 2.6 on the 24 grid rather than 2.2) — a
  hairline scaled to 1024 reads weak beside Apple's icons.

  The agent and the gateway share one mark. The app icon is the only place it
  appears on a tile; everywhere else it is the flat phosphor stroke.

  Rasterise, then let build.sh generate the .icns set:
      qlmanage -t -s 1024 -o . agent-app-icon.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Cold steel, lit from above -->
    <linearGradient id="plate" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%"   stop-color="#1C2532"/>
      <stop offset="52%"  stop-color="#101720"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>

    <!-- Specular sheen across the upper third -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- The plate is lit from inside by the beam it carries -->
    <radialGradient id="phosphor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#3FD69B" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#3FD69B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#3FD69B" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>

    <!-- filterUnits in user space: a filter applied to a scaled group has its
         region computed in the scaled coordinate system, which clips to a
         visible rectangle. The filter goes on an untransformed wrapper instead. -->
    <filter id="glyphGlow" filterUnits="userSpaceOnUse"
            x="100" y="280" width="824" height="464">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#3FD69B" flood-opacity="0.45"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Plate -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)"/>
  </g>

  <!-- Sheen and the light the beam throws, clipped to the squircle -->
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <ellipse cx="512" cy="512" rx="440" ry="330" fill="url(#phosphor)"/>
  </g>

  <!-- Machined rim -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Mark: 24-unit grid at scale 26, centred (512 - 12*26 = 200) -->
  <g filter="url(#glyphGlow)">
    <g transform="translate(200 200) scale(26)"
       fill="none" stroke="#3FD69B" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 6.5H5L9 12"/>
      <path d="M2 12H9"/>
      <path d="M2 17.5H5L9 12"/>
      <path d="M9 12L13 8L17 12L13 16Z"/>
      <path d="M17 12H22"/>
    </g>
  </g>
</svg>
