<!--
  MCP Gateway — "Converging Gate" mark.
  Three traces converge on a single point and pass through a diamond threshold,
  leaving as one beam: many MCP servers, one guarded endpoint.

  Drawn on lucide's 24 grid at stroke 2 with round caps so it sits correctly
  beside the lucide icons used in the dashboard and the agent app. Uses
  currentColor — set the colour on the parent.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M2.5 6.5h3L10 12"/>
  <path d="M2.5 12h7.5"/>
  <path d="M2.5 17.5h3L10 12"/>
  <path d="M14 8 18 12l-4 4-4-4Z"/>
  <path d="M18 12h3.5"/>
</svg>
