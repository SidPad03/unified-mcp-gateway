server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` so they're sent on error responses too.
    # The CSP allows the sources the dashboard actually uses: same-origin
    # scripts, inline styles (Tailwind), the brand icon CDNs used by the usage
    # graph (jsdelivr, simpleicons, unpkg, cursor.com), and the optional direct
    # OpenAI API call from the Settings page. connect-src allows ws:/wss: because
    # the live/usage graph WebSocket can point at a user-configured gateway URL
    # on any host; HTTP fetches stay restricted to same-origin + OpenAI.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.jsdelivr.net https://cdn.simpleicons.org https://unpkg.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.openai.com ws: wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The agent's browser sign-in page is the one *HTML* response the gateway
    # serves, and it ships its own Content-Security-Policy written for what it
    # is: a single page with an inline script and no other resources at all.
    #
    # It needs its own location because two CSP headers are intersected, not
    # merged. Inheriting the SPA policy above put `script-src 'self'` alongside
    # the page's `script-src 'unsafe-inline'`, and between them nothing could run
    # the inline script. The submit handler was never registered, so clicking
    # "Sign in and authorize" fell through to a native form submission, which the
    # page's own `form-action 'none'` then blocked. The button did nothing, in
    # silence, with no console error a user would ever see.
    #
    # `add_header` is replace-not-merge in nginx: naming any header here drops
    # every inherited one, which is what keeps the SPA's CSP off this response.
    # The two below are safe to restate because the page sets neither.
    location = /api/v1/agent/authorize {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://mcp-gateway-server:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The agent's tunnel. The server mounts this at the top level, beside
    # /api/v1 rather than under it, so the /api/ location below never covered
    # it: the request fell through to the SPA fallback and came back as
    # index.html with a 200, which the agent reports as "Gateway returned HTTP
    # 200 OK to the WebSocket upgrade". Sign-in *is* under /api/v1 and was
    # proxied, so the symptom was an agent that authorised happily and then
    # never connected.
    location /agent/ws {
        proxy_pass http://mcp-gateway-server:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The tunnel is meant to stay open. The default 60s read timeout would
        # tear it down and make the agent look like it was flapping.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy API requests to backend (including WebSocket upgrades)
    location /api/ {
        proxy_pass http://mcp-gateway-server:3200;
        # nginx proxies as HTTP/1.0 unless told otherwise, and Connection:
        # upgrade is an HTTP/1.1 mechanism, so the Upgrade header below was
        # being set on a request not entitled to use it. `/api/v1/ws/live`, the
        # dashboard's live feed, did still complete its handshake without this,
        # so it was not visibly broken; it is nginx's documented recipe for
        # proxying WebSockets and the version this asks for is the one the
        # headers assume.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Proxy Prometheus metrics endpoint (moved to avoid SPA route conflict)
    location = /api/prometheus/metrics {
        proxy_pass http://mcp-gateway-server:3200/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
